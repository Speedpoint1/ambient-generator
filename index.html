<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Mustergenerator</title>
<style>
  :root {
    --bg: #0a0a12;
    --panel-bg: rgba(20, 20, 30, 0.75);
    --text: #e8e8f0;
    --text-dim: #9494a8;
    --accent: #7dd3fc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 13px;
    max-width: 240px;
    transition: opacity 0.3s ease;
  }
  #panel h1 {
    font-size: 14px;
    margin: 0 0 8px 0;
    font-weight: 600;
    color: var(--accent);
  }
  #panel p {
    margin: 4px 0;
    color: var(--text-dim);
    line-height: 1.4;
  }
  #panel .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0 2px 0;
  }
  #panel label {
    color: var(--text-dim);
    font-size: 12px;
  }
  #panel select, #panel input[type=range] {
    width: 120px;
  }
  #panel select {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 12px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover {
    background: rgba(255,255,255,0.18);
  }
  button.primary {
    background: var(--accent);
    color: #0a0a12;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover {
    background: #a5e3fd;
  }
  #toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #panel.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #ctxmenu {
    position: fixed;
    display: none;
    flex-direction: column;
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 6px;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #ctxmenu button {
    background: transparent;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
  }
  #ctxmenu button:hover {
    background: rgba(255,255,255,0.1);
  }
  #ctxmenu button:disabled {
    color: var(--text-dim);
    cursor: default;
    background: transparent;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<button id="toggle" title="Panel ein-/ausblenden">☰</button>

<div id="panel">
  <h1>✨ Ambient Mustergenerator</h1>
  <p>Bewege die Maus für fließende Spuren. Klicke für eine Farbexplosion.</p>
  <p>Effekte bleiben stehen. Rechtsklick auf die Leinwand: letzten Effekt löschen oder alles löschen.</p>

  <div class="row">
    <label for="palette">Palette</label>
    <select id="palette">
      <option value="aurora">Aurora</option>
      <option value="sunset">Sunset</option>
      <option value="ocean">Ocean</option>
      <option value="neon">Neon</option>
      <option value="mono">Monochrom</option>
    </select>
  </div>

  <div class="row">
    <label for="density">Dichte</label>
    <input type="range" id="density" min="1" max="5" step="1" value="3">
  </div>

  <div class="btn-row">
    <button id="clearBtn">Löschen</button>
    <button id="saveBtn" class="primary">PNG speichern</button>
  </div>
</div>

<div id="ctxmenu">
  <button id="ctxUndo">Letzten Effekt löschen</button>
  <button id="ctxClearAll">Alle Effekte löschen</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Größenänderung löscht den Pixelpuffer und macht alte Undo-Snapshots ungültig
    undoStack = [];
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(document.body);
  }

  const PALETTES = {
    aurora: ['#7dd3fc', '#a78bfa', '#34d399', '#f0abfc', '#5eead4'],
    sunset: ['#fb923c', '#f472b6', '#facc15', '#f87171', '#fdba74'],
    ocean:  ['#22d3ee', '#3b82f6', '#0ea5e9', '#67e8f9', '#818cf8'],
    neon:   ['#f0f', '#0ff', '#39ff14', '#ff0055', '#ffe600'],
    mono:   ['#e8e8f0', '#b8b8c8', '#8888a0', '#d8d8e8', '#f0f0f8']
  };

  let currentPalette = PALETTES.aurora;
  let densityLevel = 3;

  document.getElementById('palette').addEventListener('change', (e) => {
    currentPalette = PALETTES[e.target.value];
  });
  document.getElementById('density').addEventListener('input', (e) => {
    densityLevel = parseInt(e.target.value, 10);
  });

  function pickColor() {
    return currentPalette[Math.floor(Math.random() * currentPalette.length)];
  }

  // --- Partikelsystem ---
  class Particle {
    constructor(x, y, opts) {
      this.x = x;
      this.y = y;
      const angle = opts.angle !== undefined ? opts.angle : Math.random() * Math.PI * 2;
      const speed = opts.speed !== undefined ? opts.speed : Math.random() * 2 + 0.5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = opts.decay || (Math.random() * 0.012 + 0.006);
      this.radius = opts.radius || (Math.random() * 3 + 1);
      this.color = opts.color || pickColor();
      this.hueDrift = (Math.random() - 0.5) * 0.02;
      this.gravity = opts.gravity || 0;
      this.drag = opts.drag !== undefined ? opts.drag : 0.99;
    }
    update() {
      this.vx *= this.drag;
      this.vy *= this.drag;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }
    draw(ctx) {
      if (this.life <= 0) return;
      ctx.globalAlpha = Math.max(this.life, 0);
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let particles = [];
  const MAX_PARTICLES = 2500;

  let mouseX = W / 2, mouseY = H / 2, lastX = mouseX, lastY = mouseY;
  let hasMoved = false;
  let isDown = false;

  // --- Undo: ein Snapshot pro Interaktion (Klick+Zug oder Tap+Zug) ---
  let undoStack = [];
  const MAX_UNDO = 20;

  function snapshotForUndo() {
    if (undoStack.length >= MAX_UNDO) undoStack.shift();
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    updateCtxMenuState();
  }

  function undoLastEffect() {
    const snapshot = undoStack.pop();
    if (!snapshot) return;
    ctx.putImageData(snapshot, 0, 0);
    particles = [];
    updateCtxMenuState();
  }

  function clearAllEffects() {
    undoStack = [];
    clearCanvas();
    updateCtxMenuState();
  }

  function updateCtxMenuState() {
    document.getElementById('ctxUndo').disabled = undoStack.length === 0;
  }

  function spawnTrail(x, y, vx, vy) {
    const speed = Math.min(Math.hypot(vx, vy), 40);
    const count = Math.floor((densityLevel * 1.5) + speed / 6);
    for (let i = 0; i < count; i++) {
      if (particles.length > MAX_PARTICLES) particles.shift();
      const spread = (Math.random() - 0.5) * 0.8;
      const baseAngle = Math.atan2(vy, vx) + Math.PI + spread;
      particles.push(new Particle(x, y, {
        angle: baseAngle + (Math.random() - 0.5),
        speed: Math.random() * 1.5 + 0.3,
        radius: Math.random() * 2.5 + 0.8,
        decay: Math.random() * 0.015 + 0.008,
        color: pickColor(),
        drag: 0.97
      }));
    }
  }

  function spawnBurst(x, y) {
    const count = 90 + densityLevel * 20;
    for (let i = 0; i < count; i++) {
      if (particles.length > MAX_PARTICLES) particles.shift();
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      particles.push(new Particle(x, y, {
        angle,
        speed: Math.random() * 6 + 2,
        radius: Math.random() * 4 + 1.5,
        decay: Math.random() * 0.01 + 0.006,
        color: pickColor(),
        gravity: 0.02,
        drag: 0.965
      }));
    }
  }

  canvas.addEventListener('mousemove', (e) => {
    lastX = mouseX; lastY = mouseY;
    mouseX = e.clientX; mouseY = e.clientY;
    const vx = mouseX - lastX, vy = mouseY - lastY;
    if (hasMoved) spawnTrail(mouseX, mouseY, vx, vy);
    hasMoved = true;
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isDown = true;
    snapshotForUndo();
    spawnBurst(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseup', () => { isDown = false; });

  // Touch-Unterstützung
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    lastX = mouseX; lastY = mouseY;
    mouseX = t.clientX; mouseY = t.clientY;
    const vx = mouseX - lastX, vy = mouseY - lastY;
    if (hasMoved) spawnTrail(mouseX, mouseY, vx, vy);
    hasMoved = true;
  }, { passive: false });
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    mouseX = t.clientX; mouseY = t.clientY;
    lastX = mouseX; lastY = mouseY;
    hasMoved = true;
    snapshotForUndo();
    spawnBurst(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY);
  });

  // --- Sanfte Ambient-Drift, auch ohne Interaktion ---
  let ambientTimer = 0;
  function ambientDrift(t) {
    ambientTimer += 1;
    if (ambientTimer % 14 === 0) {
      const x = W / 2 + Math.sin(t * 0.0004) * W * 0.32;
      const y = H / 2 + Math.cos(t * 0.00031) * H * 0.28;
      particles.push(new Particle(x, y, {
        angle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.6 + 0.1,
        radius: Math.random() * 2 + 0.5,
        decay: 0.004,
        color: pickColor(),
        drag: 0.995
      }));
    }
  }

  function clearCanvas() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
    particles = [];
  }

  document.getElementById('clearBtn').addEventListener('click', clearAllEffects);

  function showCtxMenu(x, y) {
    const menu = document.getElementById('ctxmenu');
    updateCtxMenuState();
    menu.style.display = 'flex';
    const rect = menu.getBoundingClientRect();
    menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + 'px';
  }

  function hideCtxMenu() {
    document.getElementById('ctxmenu').style.display = 'none';
  }

  document.getElementById('ctxUndo').addEventListener('click', () => {
    undoLastEffect();
    hideCtxMenu();
  });
  document.getElementById('ctxClearAll').addEventListener('click', () => {
    clearAllEffects();
    hideCtxMenu();
  });
  window.addEventListener('click', hideCtxMenu);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtxMenu(); });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    link.download = `ambient-muster-${ts}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.getElementById('toggle').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('hidden');
  });

  function animate(t) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ambientDrift(t);
    requestAnimationFrame(animate);
  }

  resize();
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
